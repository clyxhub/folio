name: Build Android (APK + AAB)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      FOLIO_VERSION_CODE: ${{ github.run_number }}
      FOLIO_VERSION_NAME: 1.0.0
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm run build

      - name: Add Android platform (first run only)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync web assets into the native project
        run: npx cap sync android

      - name: Generate launcher icon + splash
        run: npx capacitor-assets generate --android

      - name: Build debug APK and AAB
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug bundleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: folio-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload debug AAB
        uses: actions/upload-artifact@v4
        with:
          name: folio-debug-aab
          path: android/app/build/outputs/bundle/debug/*.aab

      - name: Check for signing secret
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write release keystore
        if: steps.keystore.outputs.present == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > android/app/folio-release.keystore

      - name: Add signing config + version
        if: steps.keystore.outputs.present == 'true'
        run: node scripts/patch-android-signing.mjs

      - name: Build signed release APK and AAB
        if: steps.keystore.outputs.present == 'true'
        working-directory: android
        env:
          FOLIO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FOLIO_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FOLIO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease bundleRelease

      - name: Upload release APK
        if: steps.keystore.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: folio-release-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Upload release AAB
        if: steps.keystore.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: folio-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
